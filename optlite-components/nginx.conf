server {
    listen 8000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip ──────────────────────────────────────────────────────────────
    # Serve pre-compressed *.gz files (gzip_static) instead of compressing
    # on the fly. The xeus-cpp assets (~101 MB raw: 71 MB libclangCppInterOp.so
    # + 26 MB xcpp.data) are pre-gzipped in the Dockerfile, cutting the
    # network transfer to ~34 MB — the #1 cause of slow first loads and
    # "WASM initialization timed out" on student networks.
    # Live gzip (levels 6) covers text assets without .gz siblings (html,
    # css, ace worker files, ...).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/wasm application/octet-stream;
    gzip_static on;

    # COOP/COEP/CORP headers — required for SharedArrayBuffer (xeus-cpp WASM)
    # COEP: credentialless allows WebLLM to fetch cross-origin model files
    # (e.g., from Hugging Face CDN) without requiring CORP headers from those
    # servers. Still enables SharedArrayBuffer.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Service worker script — MUST be revalidated on every load (no-cache).
    # Chrome uses the sw.js HTTP caching headers to decide when to fetch an
    # updated service worker. The 30d-immutable rule below (for content-hashed
    # bundles) would otherwise pin returning students to a stale SW for up to
    # 30 days after a deploy (e.g. the kernel-gzip feature would silently never
    # reach them). no-cache = "revalidate": if unchanged, a cheap 304; if
    # changed, Chrome picks up the new SW and clients.claim() takes over. The
    # sw.js must stay tiny so this extra HEAD/GET per load is negligible.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    # SPA fallback (but NOT for /xeus-cpp/ — missing WASM files should 404).
    # The HTML entrypoints must NEVER be cached by the browser: they carry
    # the content-hashed bundle names, so a stale live.html pins the client
    # to a deleted bundle after a deploy.
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }

    # xeus-cpp WASM files — return 404 for missing files, not index.html.
    # NOTE: .js/.wasm/.data requests actually land in the static-asset regex
    # location below (nginx regex wins over prefix); this block only serves
    # as the 404 fallback for URLs that match no extension.
    location /xeus-cpp/ {
        try_files $uri $uri/ =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Must repeat COOP/COEP/CORP for asset responses (nginx add_header quirk)
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # AI reverse proxy — forwards /ai-proxy/ to the real API with key injected.
    # The browser never sees the API key; it only calls same-origin /ai-proxy/.
    # Set API_PROXY_TARGET and API_PROXY_KEY as env vars at container start.
    location /ai-proxy/ {
        resolver ${NGINX_LOCAL_RESOLVERS} valid=300s;  # auto from /etc/resolv.conf
        proxy_pass ${API_PROXY_TARGET}/;
        proxy_set_header Host $proxy_host;
        proxy_set_header Authorization "Bearer ${API_PROXY_KEY}";
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Accept $http_accept;
        proxy_buffering off;            # SSE streaming
        proxy_cache off;
        # LLM streaming responses can be long (large Ask-AI answers / slow
        # model turnaround). Raise all three timeouts well past the ingress
        # default (60s) so long generations don't die mid-stream.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Favicon — return 204 to avoid 404 noise
    location = /favicon.ico {
        return 204;
        access_log off;
        log_not_found off;
    }

    # ── xeus-cpp dynamic libraries (.so) — WASM side modules ─────────────
    # Fetched by emscripten's readBinary with Module.locateFile applied
    # (cppworker.js appends ?v=<version>), so a cacheable URL. Keep this
    # SHORTER than the version-busted assets: the 71 MB libclangCppInterOp.so
    # is the biggest blast radius if a future xeus-cpp bump changes it while
    # a browser still trusts the old cache — with max-age only (no
    # immutable) the browser will revalidate once the freshness window ends.
    # No live gzip here: the .so is always pre-gzipped (gzip_static serves
    # the .gz sibling); never recompress a 26 MB gz on the fly.
    location ~* \.so$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        # Must repeat COOP/COEP/CORP for asset responses (nginx add_header quirk)
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # Static asset caching.
    # 30d immutable is safe here:
    #   - webpack bundles are content-hashed (new name every build)
    #   - xcpp.wasm / xcpp.data / xcpp.js are fetched with ?v=<version>
    #     (see cppworker.js) and the version bumps on every xeus-cpp change
    #   - instrument.js / ts-reformat.js / opt_trace.h use ?v=Date.now()
    #   - tree-sitter.* are version-locked (grammar <-> runtime, both ship
    #     in the same tag)
    # gzip_static serves the pre-compressed .gz sibling when present
    # (xeus-cpp assets: 101 MB raw -> ~34 MB on the wire).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|whl|wasm|data|h)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Must repeat COOP/COEP/CORP for asset responses (nginx add_header quirk)
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
}
